services:
  - type: web
    name: stars-backend
    runtime: python
    buildCommand: |
      pip install uv
      bash build.sh
    startCommand: uv run --no-sync gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"